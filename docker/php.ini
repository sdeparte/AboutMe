; Production settings for the container (php.ini-production is the base).

; php.ini-production sets GPCS: under Apache, $_ENV and $_SERVER would then miss
; the container's environment variables, and Symfony would silently fall back to
; the defaults of .env (database "db_name" on 127.0.0.1).
variables_order = "EGPCS"
expose_php = Off
memory_limit = 256M
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
